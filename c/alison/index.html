<title>Alison Tulio, Esq.</title>

<style>
  :root { --bg:#f4f5f7; --card:#ffffff; --text:#14161a; --muted:#5b6370; --accent:#1f4fd8; --onaccent:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1013; --card:#181b20; --text:#f1f3f5; --muted:#9aa3b0; --accent:#6c93ff; --onaccent:#0e1013; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:16px; background:var(--bg); color:var(--text);
         font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { width:100%; max-width:380px; background:var(--card); border-radius:20px;
          padding:32px 24px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:26px; }
  .title { margin:0; color:var(--muted); }
  .company { margin:2px 0 24px; color:var(--muted); }
  a.btn { display:block; padding:14px; margin-top:10px; border-radius:12px; text-decoration:none;
          font-weight:600; border:2px solid var(--accent); color:var(--accent); }
  a.primary { background:var(--accent); color:var(--onaccent); }
  .addr { display:block; margin-top:22px; color:var(--muted); font-size:14px; text-decoration:none; }
</style>
</head>
